name: CI

on:
  push:
  pull_request:

jobs:
  go-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [services/proxy, services/quota-daemon]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Test ${{ matrix.path }}
        run: |
          cd ${{ matrix.path }}
          go test ./...

  portal-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          cd services/portal-api
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: |
          cd services/portal-api
          pytest
